spring.application.name=demo

# H2 runs in memory, so the database is created when the app starts.
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the table from the Expense entity automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable the H2 browser console for learning and debugging.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
